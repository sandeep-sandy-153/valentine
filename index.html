<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Chinni 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      width: 92%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h2 {
      color: #e91e63;
      line-height: 1.4;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 120px;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
    }

    button {
      width: 120px;
      height: 55px;
      border-radius: 28px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #yesBtn {
      background: #e91e63;
      color: white;
    }

    #noBtn {
      background: #aaa;
      color: white;
      position: absolute;
      left: 220px;
      top: 0;
    }

    #message {
      display: none;
      font-size: 18px;
      font-weight: bold;
      color: #e91e63;
      margin-top: 20px;
      line-height: 1.4;
    }

    /* 👈 CLICK HINT */
    .hint {
      display: none;
      margin-top: 15px;
      font-size: 18px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* ❤️ HEARTS */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }

    /* 📸 SLIDER */
    .slider {
      display: none;
      margin-top: 20px;
    }

    .slider img {
      width: 100%;
      border-radius: 15px;
    }

    .caption {
      margin-top: 10px;
      font-size: 16px;
      color: #e91e63;
      font-weight: 600;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .nav button {
      width: auto;
      padding: 8px 14px;
      font-size: 14px;
      background: #e91e63;
      color: white;
      border-radius: 20px;
    }

    .final {
      display: none;
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      color: #e91e63;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="https://sandeep-sandy-153.github.io/valentine/valentine-music.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h2>Chinni my love 💖<br>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙅‍♂️</button>
  </div>

  <div id="message">
    Yayyyy!!! 💕<br>
    You just made my heart the happiest ❤️
  </div>

  <div class="hint">👈 Click 👉</div>

  <div class="slider">
    <img id="slideImg">
    <div class="caption" id="slideText"></div>

    <div class="nav">
      <button id="prev">⬅️</button>
      <button id="next">➡️</button>
    </div>
  </div>

  <div class="final">
    Chinni my love,<br>
    This little journey is my way of telling you<br>
    that choosing you was the easiest decision of my life ❤️
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const music = document.getElementById("bgMusic");
  const message = document.getElementById("message");
  const hint = document.querySelector(".hint");
  const slider = document.querySelector(".slider");
  const finalMsg = document.querySelector(".final");

  noBtn.onmouseover = () => {
    noBtn.style.left = Math.random() * 200 + "px";
    noBtn.style.top = Math.random() * 80 + "px";
  };

  yesBtn.onclick = () => {
    document.querySelector(".buttons").style.display = "none";
    message.style.display = "block";
    hint.style.display = "block";
    music.volume = 0.4;
    music.play();
    startHearts();
  };

  hint.onclick = () => {
    hint.style.display = "none";
    slider.style.display = "block";
    showSlide();
  };

  function startHearts() {
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "❤️";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = (Math.random() * 2 + 3) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5000);
    }, 300);
  }

  const slides = [
    {img:"photo1.jpg", text:"The day I realized you were special ❤️"},
    {img:"photo2.jpg", text:"Your smile still makes everything better"},
    {img:"photo3.jpg", text:"Every moment with you feels right"},
    {img:"photo4.jpg", text:"You turned ordinary days into memories"},
    {img:"photo5.jpg", text:"With you, even silence feels warm"},
    {img:"photo6.jpg", text:"I found my calm in you"},
    {img:"photo7.jpg", text:"You are my favorite thought"},
    {img:"photo8.jpg", text:"Laughs, fights, love – all with you"},
    {img:"photo9.jpg", text:"I choose you, every single day"},
    {img:"photo10.jpg", text:"My today and all my tomorrows"},
    {img:"photo11.jpg", text:"This is just the beginning… 💍"}
  ];

  let index = 0;
  const img = document.getElementById("slideImg");
  const txt = document.getElementById("slideText");

  function showSlide() {
    img.src = slides[index].img;
    txt.innerText = slides[index].text;
  }

  document.getElementById("next").onclick = () => {
    if (index < slides.length - 1) {
      index++;
      showSlide();
    } else {
      slider.style.display = "none";
      finalMsg.style.display = "block";
    }
  };

  document.getElementById("prev").onclick = () => {
    if (index > 0) {
      index--;
      showSlide();
    }
  };

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") document.getElementById("next").click();
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
  });
</script>

</body>
</html>
