<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Chinni 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 18px;
      text-align: center;
      width: 330px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h2 {
      color: #e91e63;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .buttons {
      position: relative;
      height: 100px;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #e91e63;
      color: white;
    }

    #noBtn {
      background-color: #aaa;
      color: white;
      position: absolute;
      left: 200px;
      top: 0;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 18px;
      color: #e91e63;
      font-weight: bold;
      line-height: 1.4;
    }

    /* ❤️ Hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c4d1e0b58.mp3?filename=romantic-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h2>Chinni my love 💖<br>Will you be my Valentine?</h2>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 🙅‍♂️</button>
    </div>

    <div id="message">
      Yayyyy!!! 💕💫<br>
      You just made my heart the happiest ❤️<br>
      I can’t wait to make countless memories with you 🌹
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const buttons = document.querySelector(".buttons");
    const container = document.querySelector(".container");
    const music = document.getElementById("bgMusic");

    function moveNoButton() {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";

      music.volume = 0.4;
      music.play();

      startHearts();
    });

    function startHearts() {
      setInterval(() => {
        for (let i = 0; i < 3; i++) {
          const heart = document.createElement("div");
          heart.classList.add("heart");
          heart.innerHTML = "❤️";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = (Math.random() * 12 + 18) + "px";
          heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 5000);
        }
      }, 300);
    }
  </script>

</body>
</html>
