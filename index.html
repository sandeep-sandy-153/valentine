<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Chinni 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  transition: background 0.8s ease;
}

.container {
  background: white;
  padding: 35px 25px;
  border-radius: 20px;
  width: 92%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  z-index: 2;
}

h2 {
  color: #e91e63;
  margin-bottom: 30px;
  line-height: 1.4;
}

.buttons {
  position: relative;
  height: 120px;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
}

button {
  width: 120px;
  height: 55px;
  border-radius: 28px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#yesBtn {
  background:#e91e63;
  color:black;
  font-weight:600;
  transition: transform 0.3s ease;
}

#yesBtn.pulse {
  animation: yesPulse 1s infinite;
}

@keyframes yesPulse {
  0% { transform: scale(1.1); }
  50% { transform: scale(1.18); }
  100% { transform: scale(1.1); }
}

#noBtn {
  background:#aaa;
  color:black;
  font-weight:600;
  position:absolute;
  left:220px;
  top:0;
}

@keyframes bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.2); }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.areSure {
  position: fixed;
  font-size: 14px;
  font-weight: bold;
  color: #e91e63;
  pointer-events: none;
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  0% { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-20px); }
}

/* YES MESSAGE */
#yesMessage {
  display:none;
  font-size:18px;
  font-weight:bold;
  color:#e91e63;
  margin-top:20px;
  line-height:1.4;
}

/* CLICK HINT */
.hint {
  display:none;
  margin-top:15px;
  font-size:18px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.1); }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://sandeep-sandy-153.github.io/valentine/valentine-music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h2 id="question">
  Chinni my love 💖<br>
  Will you be my Valentine?
</h2>

<div class="buttons">
  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙅‍♂️</button>
</div>

<div id="yesMessage">
  Yayyyy!!! 💕<br>
  You just made my heart the happiest ❤️
</div>

<div class="hint">👉 Click 👈</div>

</div>

<script>
let yesScale = 1;
let yesCentered = false;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const question = document.getElementById("question");
const yesMessage = document.getElementById("yesMessage");
const hint = document.querySelector(".hint");
const music = document.getElementById("bgMusic");

/* ---------------- HEARTBEAT SOUND ---------------- */

let heartbeatInterval;
let audioCtx;

function startHeartbeat(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  heartbeatInterval = setInterval(()=>{
    playBeat();
    setTimeout(playBeat, 180);
  },1000);
}

function playBeat(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);

  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function stopHeartbeat(){
  if(heartbeatInterval) clearInterval(heartbeatInterval);
}

/* Start heartbeat after first user interaction (browser policy) */
document.addEventListener("click", function initAudio(){
  startHeartbeat();
  document.removeEventListener("click", initAudio);
});

/* ---------------- NO BUTTON LOGIC ---------------- */

function playPopSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();
  oscillator.type = "square";
  oscillator.frequency.setValueAtTime(300, ctx.currentTime);
  gain.gain.setValueAtTime(0.1, ctx.currentTime);
  oscillator.connect(gain);
  gain.connect(ctx.destination);
  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.1);
}

function showAreYouSure(x,y){
  const text=document.createElement("div");
  text.className="areSure";
  text.innerText="Are you sure? 😏";
  text.style.left=x+"px";
  text.style.top=y+"px";
  document.body.appendChild(text);
  setTimeout(()=>text.remove(),1000);
}

function moveNoButton(e){
  noBtn.style.animation="bounce 0.3s";

  setTimeout(()=>{
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;
    const randomX = Math.random()*maxX;
    const randomY = Math.random()*maxY;

    noBtn.style.position="fixed";
    noBtn.style.left=randomX+"px";
    noBtn.style.top=randomY+"px";

    showAreYouSure(randomX,randomY);
    playPopSound();
  },150);

  yesScale += 0.05;
  yesBtn.style.transform = `scale(${yesScale})`;

  if(yesScale > 1.2){
    yesBtn.classList.add("pulse");
  }

  if(yesScale > 1.5 && !yesCentered){
    yesCentered = true;
    yesBtn.style.position = "fixed";
    yesBtn.style.left = "50%";
    yesBtn.style.top = "50%";
    yesBtn.style.transform = "translate(-50%, -50%) scale(" + yesScale + ")";
    yesBtn.style.zIndex = "1000";
  }
}

noBtn.addEventListener("mouseover",moveNoButton);
noBtn.addEventListener("click",moveNoButton);
noBtn.addEventListener("touchstart",function(e){
  e.preventDefault();
  moveNoButton(e);
});

/* ---------------- YES CLICK ---------------- */

yesBtn.onclick = () => {
  stopHeartbeat(); // stop heartbeat
  document.querySelector(".buttons").style.display="none";
  question.style.display="none";
  yesMessage.style.display="block";
  hint.style.display="block";

  music.volume=0.4;
  music.play();
};
</script>

</body>
</html>
