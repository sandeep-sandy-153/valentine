<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Chinni 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      width: 360px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h2 {
      color: #e91e63;
      margin-bottom: 35px;
      line-height: 1.4;
    }

    .buttons {
      position: relative;
      height: 120px;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
    }

    /* SAME SIZE BUTTONS */
    button {
      width: 120px;
      height: 55px;
      font-size: 16px;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #yesBtn {
      background-color: #e91e63;
      color: white;
    }

    #noBtn {
      background-color: #aaa;
      color: white;
      position: absolute;
      left: 220px;
      top: 0;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 18px;
      color: #e91e63;
      font-weight: bold;
      line-height: 1.5;
    }

    /* 🌹 ROSE PETALS */
    .petal {
      position: fixed;
      top: -20px;
      font-size: 22px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop>
    <source src="https://sandeep-sandy-153.github.io/valentine/valentine-music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h2>Chinni my love 💖<br>Will you be my Valentine?</h2>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙅‍♂️</button>
    </div>

    <div id="message">
      Yayyyy!!! 💕🌹<br>
      You just made my heart the happiest ❤️<br>
      I can’t wait to make countless memories with you 🌸
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const buttons = document.querySelector(".buttons");
    const container = document.querySelector(".container");
    const music = document.getElementById("bgMusic");

    function moveNoButton() {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";

      music.volume = 0.4;
      music.play();

      startPetals();
    });

    function startPetals() {
      setInterval(() => {
        for (let i = 0; i < 3; i++) {
          const petal = document.createElement("div");
          petal.classList.add("petal");
          petal.innerHTML = "🌹";
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.fontSize = (Math.random() * 14 + 18) + "px";
          petal.style.animationDuration = (Math.random() * 3 + 4) + "s";
          document.body.appendChild(petal);

          setTimeout(() => {
            petal.remove();
          }, 6000);
        }
      }, 350);
    }
  </script>

</body>
</html>
